name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-api.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.13.0
          python -m pip install -r requirements.txt
      - name: Run application tests
        run: python -m pytest -m "not integration" --junitxml=test-results/unit.xml
      - name: Validate Compose configuration
        run: |
          docker compose config --quiet
          docker compose -f compose.ci.yaml config --quiet
      - name: Build service images
        run: |
          docker build -t predictive-maintenance-ci:latest .
          docker build -f Dockerfile.mlflow -t predictive-maintenance-mlflow-ci:latest .
      - name: Validate monitoring configuration
        run: |
          docker compose -f compose.ci.yaml run --rm --no-deps --entrypoint /bin/promtool prometheus check rules /etc/prometheus/alert_rules.yml
          docker compose -f compose.ci.yaml run --rm --no-deps --entrypoint /bin/amtool alertmanager check-config /etc/alertmanager/alertmanager.yml
      - name: Start integration services
        run: |
          docker compose -f compose.ci.yaml up -d --wait --wait-timeout 180 postgres kafka inference-api alert-webhook alertmanager prometheus
          docker compose -f compose.ci.yaml up -d stream-consumer prediction-writer
      - name: Test prediction persistence and alert lifecycle
        env:
          RUN_INTEGRATION_TESTS: "1"
        run: python -m pytest tests/integration -v --junitxml=test-results/integration.xml
      - name: Collect service logs
        if: always()
        run: |
          mkdir -p test-results
          docker compose -f compose.ci.yaml logs --no-color > test-results/services.log 2>&1
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7
      - name: Remove temporary integration services
        if: always()
        run: docker compose -f compose.ci.yaml down --volumes --remove-orphans
