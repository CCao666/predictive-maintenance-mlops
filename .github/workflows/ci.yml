name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-api.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.13.0
          python -m pip install -r requirements.txt
      - name: Run application tests
        run: python -m pytest -m "not integration" --junitxml=test-results/unit.xml
      - name: Validate Compose configuration
        run: |
          docker compose config --quiet
          docker compose -f compose.ci.yaml config --quiet
          docker compose -f compose.yaml -f compose.staging.yaml config --quiet
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.34.1
      - name: Validate Kubernetes manifests
        run: |
          kubectl kustomize k8s > /tmp/predictive-maintenance-k8s.yaml
          docker run --rm -v /tmp/predictive-maintenance-k8s.yaml:/manifests.yaml:ro ghcr.io/yannh/kubeconform:v0.7.0 \
            -strict -summary /manifests.yaml
      - name: Build service images
        run: |
          docker build -t predictive-maintenance-ci:latest .
          docker build -f Dockerfile.mlflow -t predictive-maintenance-mlflow-ci:latest .
      - name: Create kind smoke-test cluster
        uses: helm/kind-action@v1.14.0
        with:
          cluster_name: predictive-maintenance-ci
          wait: 120s
      - name: Test Kubernetes rollout and recovery
        run: |
          kind load docker-image predictive-maintenance-ci:latest --name predictive-maintenance-ci
          kubectl create namespace predictive-maintenance
          kubectl create secret generic predictive-maintenance-secrets \
            --namespace predictive-maintenance \
            --from-literal=AWS_ACCESS_KEY_ID=ci \
            --from-literal=AWS_SECRET_ACCESS_KEY=ci
          kubectl apply -k k8s
          kubectl set image deployment/inference-api \
            inference-api=predictive-maintenance-ci:latest \
            --namespace predictive-maintenance
          kubectl set image deployment/stream-consumer \
            stream-consumer=predictive-maintenance-ci:latest \
            --namespace predictive-maintenance
          kubectl patch deployment inference-api \
            --namespace predictive-maintenance --type=strategic \
            --patch-file .github/kind-inference-patch.yaml
          kubectl patch deployment stream-consumer \
            --namespace predictive-maintenance --type=strategic \
            --patch-file .github/kind-consumer-patch.yaml
          kubectl rollout status deployment/inference-api \
            --namespace predictive-maintenance --timeout=180s
          kubectl rollout status deployment/stream-consumer \
            --namespace predictive-maintenance --timeout=180s
          kubectl port-forward --namespace predictive-maintenance \
            service/inference-api 18080:8000 >/tmp/kind-port-forward.log 2>&1 &
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:18080/ready && break
            sleep 1
          done
          curl --fail http://127.0.0.1:18080/health
          pod_name=$(kubectl get pods --namespace predictive-maintenance \
            --selector app.kubernetes.io/name=inference-api \
            --output jsonpath='{.items[0].metadata.name}')
          kubectl delete pod "$pod_name" --namespace predictive-maintenance
          kubectl rollout status deployment/inference-api \
            --namespace predictive-maintenance --timeout=180s
      - name: Validate monitoring configuration
        run: |
          docker compose -f compose.ci.yaml run --rm --no-deps --entrypoint /bin/promtool prometheus check rules /etc/prometheus/alert_rules.yml
          docker compose -f compose.ci.yaml run --rm --no-deps --entrypoint /bin/amtool alertmanager check-config /etc/alertmanager/alertmanager.yml
      - name: Start integration services
        run: |
          docker compose -f compose.ci.yaml up -d --wait --wait-timeout 180 postgres kafka inference-api drift-monitor alert-webhook alertmanager prometheus
          docker compose -f compose.ci.yaml up -d stream-consumer prediction-writer retrain-coordinator
      - name: Test prediction persistence and alert lifecycle
        env:
          RUN_INTEGRATION_TESTS: "1"
        run: python -m pytest tests/integration -v --junitxml=test-results/integration.xml
      - name: Collect service logs
        if: always()
        run: |
          mkdir -p test-results
          docker compose -f compose.ci.yaml logs --no-color > test-results/services.log 2>&1
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results/
          retention-days: 7
      - name: Remove temporary integration services
        if: always()
        run: docker compose -f compose.ci.yaml down --volumes --remove-orphans

  publish:
    name: Publish deployable images
    needs: verify
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create API image tags
        id: api-meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/ccao666/predictive-maintenance-api
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build and publish API image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.api-meta.outputs.tags }}
          labels: ${{ steps.api-meta.outputs.labels }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Create MLflow image tags
        id: mlflow-meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/ccao666/predictive-maintenance-mlflow
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build and publish MLflow image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.mlflow
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.mlflow-meta.outputs.tags }}
          labels: ${{ steps.mlflow-meta.outputs.labels }}
          cache-from: type=gha,scope=mlflow
          cache-to: type=gha,mode=max,scope=mlflow
