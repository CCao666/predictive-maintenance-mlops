global:
  scrape_interval: 2s
  evaluation_interval: 2s

rule_files:
  - /etc/prometheus/alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: inference-api
    metrics_path: /metrics
    static_configs:
      - targets: ["inference-api:8000"]

  - job_name: drift-monitor
    metrics_path: /metrics
    static_configs:
      - targets: ["drift-monitor:8081"]
