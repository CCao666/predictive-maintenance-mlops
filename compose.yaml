services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: maintenance
      POSTGRES_USER: maintenance
      POSTGRES_PASSWORD: maintenance
    volumes:
      - postgres18-data:/var/lib/postgresql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maintenance -d maintenance"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  kafka:
    image: apache/kafka:4.1.2
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 5s
      retries: 10

  inference-api:
    build:
      context: .
    image: predictive-maintenance-api:latest
    ports:
      - "8000:8000"
    environment:
      MLFLOW_TRACKING_URI: sqlite:////app/mlflow.db
      MODEL_NAME: predictive-maintenance-rul
      MODEL_ALIAS: champion
    volumes:
      - ./mlflow.db:/app/mlflow.db:ro
      # Existing MLflow runs store this absolute artifact path in mlflow.db.
      - ./mlruns:/Users/chunyangcao/Desktop/Projects/Real-Time Predictive Maintenance ML Platform/mlruns
    restart: unless-stopped

  stream-consumer:
    image: predictive-maintenance-api:latest
    command: ["python", "-m", "streaming.consumer"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      KAFKA_TOPIC: engine-sensor-readings
      KAFKA_RESULT_TOPIC: engine-rul-predictions
      INFERENCE_API_URL: http://inference-api:8000
      SEQUENCE_LENGTH: 50
    depends_on:
      kafka:
        condition: service_healthy
      inference-api:
        condition: service_healthy
    healthcheck:
      disable: true
    restart: unless-stopped

  prediction-writer:
    image: predictive-maintenance-api:latest
    command: ["python", "-m", "streaming.prediction_writer"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      KAFKA_RESULT_TOPIC: engine-rul-predictions
      DATABASE_URL: postgresql://maintenance:maintenance@postgres:5432/maintenance
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      disable: true
    restart: unless-stopped

  stream-producer:
    image: predictive-maintenance-api:latest
    command:
      - python
      - -m
      - streaming.producer
      - --data
      - data/cmapss/test_FD001.txt
      - --delay
      - "0.01"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      KAFKA_TOPIC: engine-sensor-readings
    volumes:
      - ./data:/app/data:ro
    depends_on:
      kafka:
        condition: service_healthy
      stream-consumer:
        condition: service_started
    healthcheck:
      disable: true
    restart: "no"

  prometheus:
    image: prom/prometheus:v3.14.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      inference-api:
        condition: service_healthy
      alertmanager:
        condition: service_started
    restart: unless-stopped

  alert-webhook:
    image: predictive-maintenance-api:latest
    command: ["uvicorn", "monitoring.alert_webhook:app", "--host", "0.0.0.0", "--port", "8080"]
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql://maintenance:maintenance@postgres:5432/maintenance
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.34.1
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    depends_on:
      alert-webhook:
        condition: service_healthy
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.2
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  postgres18-data:
  prometheus-data:
  grafana-data:
  alertmanager-data:
